<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrapbox Diary Launcher</title>
  <link rel="icon" href="image/favicon.ico">
  <link rel="stylesheet" href="css/launcher.css">
  <script defer src="js/diary-core.js"></script>
  <script defer src="js/launcher.js"></script>
  <script defer src="js/launcher-ui.js"></script>
</head>
<body>
  <main>
    <h1>Scrapbox Diary Launcher</h1>
    <p data-launcher-status>移動先を確認しています…</p>

    <section class="error" data-launcher-error role="alert" tabindex="-1" hidden>
      <h2>入力エラー</h2>
      <p data-launcher-error-message></p>
    </section>
  </main>
</body>
</html>
